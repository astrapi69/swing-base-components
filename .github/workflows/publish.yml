# Publishes the artifact to Maven Central via the Central Portal (nmcp settings plugin).
# Triggered by pushing a release tag (RELEASE-*), which always targets the release repository, or
# manually via workflow_dispatch, which asks where to publish (as astrapi69/randomizer#11, #13 here).
# Required repository secrets:
#   CENTRAL_PORTAL_TOKEN_USERNAME / CENTRAL_PORTAL_TOKEN_PASSWORD - Central Portal user token
#   GPG_PRIVATE_KEY / GPG_PASSPHRASE    - ascii-armored signing key and its passphrase
#   GPG_KEY_ID (optional)               - the signing subkey's last 8 hex digits, when GPG_PRIVATE_KEY
#                                         holds that subkey alone (astrapi69/lethenon, docs/launch/release-key.md)

name: Publish to Maven Central

on:
  push:
    tags: [ 'RELEASE-*' ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish (a tag push always publishes a release)'
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - release

jobs:
  publish:

    runs-on: ubuntu-latest

    env:
      # a tag push publishes a release; a manual run publishes what it was asked for. This build
      # publishes through the settings plugin, so the tasks are the aggregation's.
      PUBLISH_TASK: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'snapshot') && 'nmcpPublishAggregationToCentralPortalSnapshots' || 'nmcpPublishAggregationToCentralPortal' }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb and what the display plugin needs
        # io.github.astrapi69.own-display starts an Xvfb of the build's own and fluxbox on it, waits
        # until wmctrl sees the window manager, and uses the display only when ss (iproute2) names
        # that Xvfb as the listener on its socket; xdpyinfo is in x11-utils. xvfb-run gave no window
        # manager (astrapi69/mystic-crypt-ui#322, astrapi69/mystic-crypt-ui#505)
        run: sudo apt-get update && sudo apt-get install -y xvfb fluxbox wmctrl x11-utils iproute2
      - name: Build
        # no xvfb-run: every test task gets its display from the plugin, as it does on a desktop
        run: ./gradlew build
      # nmcp uploads and validates the bundle directly - no separate manual staging-upload step
      # needed (unlike the plain maven-publish + OSSRH-staging-api repos in this family).
      - name: Publish to the Central Portal
        run: |
          echo "publishing with $PUBLISH_TASK"
          ./gradlew "$PUBLISH_TASK"
        env:
          CENTRAL_PORTAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          CENTRAL_PORTAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
